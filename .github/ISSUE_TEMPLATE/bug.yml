name: Bug report
description: Something does not work as the docs say.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste tokens, session files, private messages or anyone's real data. Use invented
        examples (Alice Example, Bob Sample). A security problem goes to a private report instead:
        https://github.com/WireCatLabs/community/blob/main/security/README.md
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `<tool> --version`, for example `tg --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04, Windows 11…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran, as few as show the problem.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The output or error, with private data removed.
    validations:
      required: true
